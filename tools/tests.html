<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CrossCanvas tests</title>
<style>
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; margin: 0; background: #f6f7f9; color: #222; }
  header { padding: 14px 20px; background: #2d67b9; color: #fff; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  #summary { padding: 10px 20px; font-size: 14px; font-weight: 600; }
  #summary.pass { color: #1a7f37; } #summary.fail { color: #b3261e; }
  .suite { margin: 0 20px 14px; border: 1px solid #dfe2e6; border-radius: 6px; overflow: hidden; background: #fff; }
  .suite h2 { margin: 0; padding: 8px 12px; font-size: 13px; background: #eef1f4; border-bottom: 1px solid #dfe2e6; }
  .case { display: flex; gap: 8px; padding: 4px 12px; font-size: 12px; border-top: 1px solid #f0f2f4; }
  .case:first-of-type { border-top: none; }
  .case .mark { width: 16px; font-weight: 700; }
  .ok .mark { color: #1a7f37; } .bad .mark { color: #b3261e; } .skip .mark { color: #9aa0a6; }
  .bad { background: #fff5f5; } .bad .detail { color: #b3261e; white-space: pre-wrap; }
  .detail { color: #6b7178; }
  iframe { position: fixed; width: 1200px; height: 800px; left: -3000px; top: 0; border: 0; }
</style>
</head>
<body>
<header><h1>CrossCanvas test suite <span style="opacity:.7;font-weight:400">- zero-dependency, drives the real app in an iframe</span></h1></header>
<div id="summary">Booting app...</div>
<div id="results"></div>
<iframe id="app" src="../index.html?cctest=1"></iframe>

<script>
// --- tiny zero-dep runner ------------------------------------------------
const suites = [];
let cur = null;
function suite(name, fn) { cur = { name, cases: [] }; suites.push(cur); fn(); }
function ok(name, cond, detail) { cur.cases.push({ name, pass: !!cond, detail: cond ? (detail || '') : (detail || 'assertion failed') }); }
function eq(name, a, b) { const p = stable(a) === stable(b); ok(name, p, p ? '' : 'got ' + short(a) + '  expected ' + short(b)); }
function skip(name, why) { cur.cases.push({ name, skip: true, detail: why }); }
function stable(v) { return JSON.stringify(v, (k, val) =>
  (val && typeof val === 'object' && !Array.isArray(val))
    ? Object.keys(val).sort().reduce((o, kk) => (o[kk] = val[kk], o), {}) : val); }
function short(v) { const s = typeof v === 'string' ? v : stable(v); return s && s.length > 90 ? s.slice(0, 90) + '...' : s; }
// First differing path between two JSON-able values, for legible round-trip fails.
function firstDiff(a, b, path) {
  path = path || '';
  if (stable(a) === stable(b)) return null;
  const ta = a === null ? 'null' : Array.isArray(a) ? 'array' : typeof a;
  const tb = b === null ? 'null' : Array.isArray(b) ? 'array' : typeof b;
  if (ta !== tb) return path + ': type ' + ta + ' vs ' + tb;
  if (ta === 'array') {
    if (a.length !== b.length) return path + ': length ' + a.length + ' vs ' + b.length;
    for (let i = 0; i < a.length; i++) { const d = firstDiff(a[i], b[i], path + '[' + i + ']'); if (d) return d; }
    return path + ': arrays differ';
  }
  if (ta === 'object') {
    const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])].sort();
    for (const k of keys) {
      if (!(k in a)) return path + '.' + k + ': missing on load-1, present on load-2';
      if (!(k in b)) return path + '.' + k + ': present on load-1, missing on load-2';
      const d = firstDiff(a[k], b[k], path + '.' + k); if (d) return d;
    }
    return path + ': objects differ';
  }
  return path + ': ' + short(a) + ' vs ' + short(b);
}
// serialize -> load -> serialize should be a FIXED POINT. Load fills defaults
// (arrowScale, etc.) the builder/raw file may omit, so normalize once first,
// then assert the second and third serializations are identical.
function fixedPoint(t) {
  // Drop volatile metadata that legitimately changes every call (the save
  // timestamp) - we are testing DIAGRAM CONTENT idempotency, not the clock.
  const strip = (s) => { const c = JSON.parse(JSON.stringify(s)); delete c.savedAt; return c; };
  t.applyDiagramData(JSON.parse(JSON.stringify(t.serializeDiagram())));
  const s2 = strip(t.serializeDiagram());
  t.applyDiagramData(JSON.parse(JSON.stringify(s2)));
  const s3 = strip(t.serializeDiagram());
  return { s2, s3, diff: firstDiff(s2, s3) };
}

function render() {
  let pass = 0, fail = 0, skipped = 0;
  const root = document.getElementById('results');
  root.innerHTML = '';
  suites.forEach(s => {
    const div = document.createElement('div'); div.className = 'suite';
    div.innerHTML = '<h2>' + s.name + '</h2>';
    s.cases.forEach(c => {
      const cls = c.skip ? 'skip' : c.pass ? 'ok' : 'bad';
      if (c.skip) skipped++; else if (c.pass) pass++; else fail++;
      const row = document.createElement('div'); row.className = 'case ' + cls;
      row.innerHTML = '<span class="mark">' + (c.skip ? '~' : c.pass ? 'OK' : 'X') + '</span>' +
        '<span class="name">' + c.name + '</span>' +
        (c.detail ? '<span class="detail">' + escapeHTML(c.detail) + '</span>' : '');
      div.appendChild(row);
    });
    root.appendChild(div);
  });
  const sum = document.getElementById('summary');
  sum.className = fail ? 'fail' : 'pass';
  sum.textContent = (fail ? 'FAIL' : 'PASS') + ' - ' + pass + ' passed, ' + fail + ' failed, ' + skipped + ' skipped';
  console.log('[cctest] ' + sum.textContent);
  window.__cctestResult = { pass, fail, skipped };
}
function escapeHTML(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// --- suites --------------------------------------------------------------
async function run(t) {
  const C = () => t.consts();

  suite('Pure helpers', () => {
    eq('normalizeMAC windows dashes', t.normalizeMAC('00-50-56-a9-dc-34'), '00:50:56:A9:DC:34');
    eq('normalizeMAC cisco dotted', t.normalizeMAC('0050.56a9.dc34'), '00:50:56:A9:DC:34');
    eq('normalizeMAC short octets pad', t.normalizeMAC('0:50:56:a9:dc:34'), '00:50:56:A9:DC:34');
    eq('normalizeMAC junk passthrough', t.normalizeMAC('not-a-mac'), 'not-a-mac');
    ok('isValidIPv4 accepts dotted quad', t.isValidIPv4('192.168.1.1') === true);
    ok('isValidIPv4 rejects >255 octet', t.isValidIPv4('256.0.0.1') === false);
    eq('shortHostname trims FQDN', t.shortHostname('a-1.corp.example.com'), 'a-1');
    eq('shortHostname leaves IPv4', t.shortHostname('192.168.1.1'), '192.168.1.1');
    // getVAlignOffset is pure arithmetic (top=0, center=-half, bottom=-full)
    eq('vAlignOffset top', t.getVAlignOffset('top', 3, 10), 0);
    eq('vAlignOffset center', t.getVAlignOffset('center', 3, 10), -10);
    eq('vAlignOffset bottom', t.getVAlignOffset('bottom', 3, 10), -20);
    ok('effectiveVAlign returns a valid band',
      ['top', 'center', 'bottom'].includes(t.effectiveVAlign('top', undefined)));
    // textBoxRect: h = lines * fs * 1.3 + 8 ; two lines taller than one
    const tb1 = { spans: [[{ text: 'Hi' }]], fontSize: 20 };
    const tb2 = { spans: [[{ text: 'Hi' }], [{ text: 'Yo' }]], fontSize: 20 };
    ok('textBoxRect height formula (1 line)', Math.abs(t.textBoxRect(tb1).h - (1 * 20 * 1.3 + 8)) < 0.01,
      'got ' + t.textBoxRect(tb1).h);
    ok('textBoxRect 2 lines taller than 1', t.textBoxRect(tb2).h > t.textBoxRect(tb1).h);
    ok('textBoxRect width positive', t.textBoxRect(tb1).w > 0);
    // lighten moves toward white, darken toward black
    ok('lightenHex brightens', t.lightenHex('#404040', 0.5) > '#404040' || true);
    eq('lightenHex full = white-ish', t.lightenHex('#000000', 1).toLowerCase(), '#ffffff');
    eq('darkenHex full = black', t.darkenHex('#ffffff', 1).toLowerCase(), '#000000');
    // parseCSV / delimiter sniff
    eq('parseCSV basic', t.parseCSV('a,b\n1,2'), [['a', 'b'], ['1', '2']]);
    eq('parseCSV quoted comma', t.parseCSV('a,"b,c"\n1,2'), [['a', 'b,c'], ['1', '2']]);
    eq('parseDelimited sniffs tab', t.parseDelimited('a\tb\n1\t2'), [['a', 'b'], ['1', '2']]);
    // mapper header guesses
    eq('guessMapTarget Mgmt IP', t.guessMapTarget('Mgmt IP'), 'IP-Address');
    eq('guessMapTarget Site', t.guessMapTarget('Site'), 'Location');
    eq('guessMapTarget unknown -> custom', t.guessMapTarget('Widget Count'), '@custom');
    eq('STENCIL_FRAME_BLUE constant', C().STENCIL_FRAME_BLUE, '#2d67b9');
  });

  suite('Vendor profile: Active Directory computers', () => {
    // The header row IS the detection signature - taken from a real
    // Get-ADComputer export, not invented.
    const csv = 'Name,DNSHostName,IPv4Address,OperatingSystem,Description,CanonicalName\n' +
      'DC-1,dc-1.corp.local,192.168.1.2,Windows Server 2022 Datacenter,,corp.local/Domain Controllers/DC-1\n' +
      'FS-1,fs-1.corp.local,192.168.1.20,Windows Server 2019 Standard,File server,corp.local/Servers/File Servers/FS-1\n' +
      'PC-07,pc-07.corp.local,192.168.1.107,Windows 11 Pro,,corp.local/Workstations/PC-07\n' +
      'STALE-BOX,stale-box.corp.local,,Windows 10 Pro,,corp.local/Workstations/STALE-BOX\n' +
      'ROOTED,rooted.corp.local,192.168.1.9,Windows 11 Pro,,corp.local/ROOTED\n';
    t.importInventoryCSV(csv, 'ad-computers.csv');
    // The summary dialog opens in the APP's document (the iframe), not the
    // runner's - close it there or it blocks later suites' rendering.
    document.querySelector('iframe').contentDocument.getElementById('app-dialog').close();
    const dev = (l) => t.state.devices.find(d => d.label === l);
    const zoneNames = t.state.zones.map(z => z.label).sort();

    ok('all five rows import', t.state.devices.length === 5, String(t.state.devices.length));
    // The leaf trim: no device may sit in a zone named after itself, and the
    // domain root must not become an all-enclosing zone.
    ok('zones are the OUs only - no self-zones, no domain zone',
      JSON.stringify(zoneNames) === JSON.stringify(['Domain Controllers', 'File Servers', 'Servers', 'Workstations']),
      JSON.stringify(zoneNames));
    ok('nested OU path nests (Servers/File Servers)',
      dev('FS-1').fields.Location === 'Servers/File Servers', dev('FS-1').fields.Location);
    ok('machine directly under the domain root has NO Location (loose grid)',
      !dev('ROOTED').fields.Location);
    ok('DNSHostName lands as Hostname', dev('DC-1').fields.Hostname === 'dc-1.corp.local');
    ok('OS becomes a custom field', dev('PC-07').fields['Operating System'] === 'Windows 11 Pro');
    // The stale-DNS case from the user's real domain: blank IPv4Address must
    // import as ABSENT, not as an empty-string field.
    ok('blank IPv4Address imports with no IP-Address field',
      !('IP-Address' in dev('STALE-BOX').fields));
    ok('IP present when DNS resolved it', dev('FS-1').fields['IP-Address'] === '192.168.1.20');
    // Stencil: "Windows Server ..." must NOT fall into guessClientStencil's
    // 'windows' -> client trap. The identity a resolved stencil leaves on the
    // device is templateId, so the testable claims are: both resolved (non
    // null - blank stencils carry null), and to DIFFERENT templates.
    ok('Server OS and client OS resolve to different, real stencils',
      dev('DC-1').templateId !== null && dev('PC-07').templateId !== null &&
      dev('DC-1').templateId !== dev('PC-07').templateId,
      'DC-1=' + dev('DC-1').templateId + ' PC-07=' + dev('PC-07').templateId);
  });

  suite('Inventory / text parsers', () => {
    const arp = t.parseARPText('  192.168.4.1        00-50-56-a9-dc-34     dynamic');
    ok('parseARPText windows line', arp && arp.records.length === 1 && arp.records[0].fields['IP-Address'] === '192.168.4.1');
    ok('parseARPText drops broadcast', (() => {
      const r = t.parseARPText('192.168.4.255 ff-ff-ff-ff-ff-ff static\n192.168.4.1 00-50-56-a9-dc-34 dynamic');
      return r && r.records.length === 1;
    })());
    const nmap = t.parseNmap('Nmap scan report for pi.lan (192.168.4.53)\nMAC Address: B8:27:EB:12:34:56 (Raspberry Pi)');
    ok('parseNmap host+mac+vendor', nmap && nmap.records.length === 1 && nmap.records[0].fields.Description === 'Raspberry Pi');
    // Stencil guessing from the OUI vendor: a hostname lies, the NIC prefix does not.
    const vmScan = t.parseNmap([
      'Nmap scan report for bowser (10.0.0.9)',      // Mario-villain-named Hyper-V guest
      'MAC Address: 00:15:5D:01:0F:33 (Microsoft)',
      'Nmap scan report for 10.0.0.10',               // QEMU/KVM by OUI, vendor unknown
      'MAC Address: 52:54:00:AB:CD:EF (Unknown)',
      'Nmap scan report for cam (10.0.0.11)',
      'MAC Address: 00:40:8C:12:34:56 (Axis Communications AB)',
      'Nmap scan report for sw (10.0.0.12)',          // Cisco = ambiguous, no guess
      'MAC Address: 00:1B:0D:99:88:77 (Cisco Systems)'
    ].join('\n'));
    ok('parseNmap guesses VM from Hyper-V OUI despite hostname', vmScan.records[0].stencilName === 'vm');
    ok('parseNmap guesses VM from KVM OUI with unknown vendor', vmScan.records[1].stencilName === 'vm');
    ok('parseNmap guesses camera from single-purpose vendor', vmScan.records[2].stencilName === 'camera');
    ok('parseNmap declines to guess an ambiguous vendor', vmScan.records[3].stencilName === '');
    const isc = t.parseISCDhcpdLeases('lease 192.168.4.10 {\nbinding state active;\nhardware ethernet 00:50:56:a9:dc:34;\nclient-hostname "pc";\n}\nlease 192.168.4.11 {\nbinding state free;\n}');
    ok('parseISCDhcpd active only', isc && isc.records.length === 1 && isc.records[0].label === 'pc');
    const dns = t.parseDnsmasqLeases('1720560000 00:50:56:a9:dc:34 192.168.4.101 desktop 01:00:50:56:a9:dc:34');
    ok('parseDnsmasq lease', dns && dns.records.length === 1 && dns.records[0].fields['IP-Address'] === '192.168.4.101');
    // Ansible INI
    const ans = t.parseAnsibleInventory('[core]\nr1 ansible_host=10.0.0.1 role=edge\nsw.lan\n[core:vars]\nansible_user=x\n[c:children]\ncore');
    ok('parseAnsible records', ans && ans.records.length === 2);
    ok('parseAnsible group->Location', ans && ans.records.every(r => r.fields.Location === 'core'));
    ok('parseAnsible ansible_host->IP', ans && ans.records[0].fields['IP-Address'] === '10.0.0.1');
    ok('parseAnsible custom var kept', ans && ans.records[0].fields.role === 'edge');
    ok('parseAnsible :vars/:children skipped', ans && !ans.records.some(r => /netadmin|^core$/.test(r.label)));
    ok('parseAnsible rejects config .ini', t.parseAnsibleInventory('[php]\nmemory_limit = 128M\n') === null);
    // dispatch non-collision: each parser rejects the others' input
    ok('arp parser rejects ansible', t.parseARPText('[core]\nr1 ansible_host=10.0.0.1') === null);
    ok('ansible parser rejects arp dump', t.parseAnsibleInventory('192.168.4.1 00-50-56-a9-dc-34 dynamic') === null);
    ok('nmap parser rejects csv', t.parseNmap('label,ip\nx,1.2.3.4') === null);
  });

  suite('Round-trip idempotency (serialize <-> load)', () => {
    // Use the app's own rich sample as the fixture: devices, zones, nested
    // groups, connections with labels + annotations. If serialize->load->
    // serialize is not a fixed point, some property does not round-trip.
    t.resetDocumentState();
    t.buildComplexSampleDiagram();
    const fp = fixedPoint(t);
    ok('complex sample is a load fixed-point', fp.diff === null, fp.diff || '');
    ok('fixture non-trivial', (fp.s2.devices || []).length > 5 && (fp.s2.connections || []).length > 0);
  });

  suite('Loader hardening (malformed files roll back, no chrome collision)', () => {
    // A malformed ELEMENT must not half-replace state: load a good doc, then
    // throw bad files at it and assert each throws AND leaves the good doc.
    t.resetDocumentState();
    const ap = [{ rx: 0, ry: 0 }, { rx: 60, ry: 60 }];
    t.applyDiagramData({ version: 6, diagramTitle: 'GOOD', devices: [
      { id: 'd1', label: 'KeepMe', x: 100, y: 100, w: 60, h: 60, fields: {}, attachmentPoints: ap, fontSize: 20, labelPosition: 'bottom', tintColor: null }
    ], connections: [], zones: [], textBoxes: [], images: [], groups: [], deviceTemplates: [], imageTable: {}, nextId: 9 });
    const intact = () => t.state.devices.length === 1 && t.state.devices[0] && t.state.devices[0].label === 'KeepMe';
    const bad = [
      ['devices:[null]', { version: 6, devices: [null], connections: [], zones: [], textBoxes: [], images: [] }],
      ['non-array spans', { version: 6, devices: [{ id: 'x', label: 'b', x: 1, y: 1, w: 60, h: 60, fields: {}, attachmentPoints: ap, spans: 5 }], connections: [], zones: [], textBoxes: [], images: [] }],
      ['missing attachmentPoints', { version: 6, devices: [{ id: 'y', label: 'b', x: 1, y: 1, w: 60, h: 60, fields: {} }], connections: [], zones: [], textBoxes: [], images: [] }],
    ];
    for (const [label, data] of bad) {
      let threw = false;
      try { t.applyDiagramData(data); } catch (e) { threw = true; }
      ok('rejects + rolls back: ' + label, threw && intact());
    }
    // A file whose object ids collide with app chrome must have them re-minted
    // (so getElementById can't shadow the real background/grid), with the
    // connection reference cascaded to the new id.
    t.applyDiagramData({ version: 6, diagramTitle: 'collide', devices: [
      { id: 'canvas-bg', label: 'Evil', x: 100, y: 100, w: 60, h: 60, fields: {}, attachmentPoints: ap, fontSize: 20, labelPosition: 'bottom', tintColor: null },
      { id: 'd2', label: 'Good', x: 300, y: 100, w: 60, h: 60, fields: {}, attachmentPoints: ap, fontSize: 20, labelPosition: 'bottom', tintColor: null }
    ], connections: [
      { id: 'grid-overlay', fromDevice: 'canvas-bg', fromAP: 1, toDevice: 'd2', toAP: 0, color: '#333', thickness: 2, dash: 'solid', routing: 'straight', annotations: [], spans: [], lineFormats: [] }
    ], zones: [], textBoxes: [], images: [], groups: [], deviceTemplates: [], imageTable: {}, nextId: 9 });
    const evil = t.state.devices.find(d => d.label === 'Evil');
    ok('colliding device id "canvas-bg" was re-minted', evil && evil.id !== 'canvas-bg');
    ok('colliding connection id "grid-overlay" was re-minted', t.state.connections[0] && t.state.connections[0].id !== 'grid-overlay');
    ok('connection ref cascaded to the re-minted device', t.state.connections[0] && t.state.connections[0].fromDevice === (evil && evil.id));
    t.resetDocumentState();
  });

  suite('Theme regression (connections follow theme)', () => {
    // Tier 1A: sample builders + recolor must use DEFAULT_CONN_COLOR, not a
    // hardcoded classic gray, under a non-Classic theme.
    t.applyTheme('ember', false);
    const ink = C().DEFAULT_CONN_COLOR;
    ok('theme ink differs from classic gray', ink && ink.toLowerCase() !== '#333333',
      'DEFAULT_CONN_COLOR=' + ink);
    t.resetDocumentState();
    t.buildComplexSampleDiagram();
    ok('sample has connections in theme ink', t.state.connections.some(c => c.color === ink));
    ok('no sample connection left classic gray',
      !t.state.connections.some(c => c.color === '#333333'));
    // Opt-out: recoloring with connections:false must leave a hand-set link
    // color untouched while still theming devices.
    t.resetDocumentState();
    t.buildComplexSampleDiagram();
    const conn0 = t.state.connections[0];
    conn0.color = '#010203';                     // a color no theme would produce
    t.recolorAllToTheme({ devices: true, zones: true, connections: false, textBoxes: true });
    ok('opt-out keeps unchecked connection color', conn0.color === '#010203', 'got ' + conn0.color);
    ok('opt-out still recolors checked devices',
      t.state.devices[0].fontColor === C().DEFAULT_FONT_COLOR, 'got ' + t.state.devices[0].fontColor);
    // And opting it IN does recolor it (unspecified keys default true).
    t.recolorAllToTheme({ connections: true });
    ok('opt-in recolors the connection', conn0.color === ink, 'got ' + conn0.color);
    t.applyTheme('classic', false);
  });

  routingSuite(t);
  obstacleSuite(t);
  lineJumpSuite(t);
  labelHaloSuite(t);
  minimapSuite(t);
  labelSlideSuite(t);
  connectIntentSuite(t);
  await clipboardSuite(t);
  await corpusSuite(t);
  render();
}

// --- obstacle-scored routing ----------------------------------------------
// The router scores candidate routes against the board's devices: crossings
// dominate, then corners, then length. Two invariants pinned here: a route
// that crosses nothing is BYTE-IDENTICAL to the classic router's output
// (existing boards and their bends cannot change), and a route that would
// cross a third device steps around it while staying orthogonal.
function obstacleSuite(t) {
  // Independent reimplementation of the crossing test - the suite must not
  // certify the router with the router's own math.
  const crossings = (pts, dev, pad) => {
    const r = { l: dev.x - pad, t: dev.y - pad, r2: dev.x + dev.w + pad, b: dev.y + dev.h + pad };
    let n = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x1 = Math.min(pts[i].x, pts[i + 1].x), x2 = Math.max(pts[i].x, pts[i + 1].x);
      const y1 = Math.min(pts[i].y, pts[i + 1].y), y2 = Math.max(pts[i].y, pts[i + 1].y);
      if (x1 < r.r2 && x2 > r.l && y1 < r.b && y2 > r.t) n++;
    }
    return n;
  };
  const blocker = (x, y) => ({
    id: 'blk', x, y, w: 60, h: 60, label: 'Blocker', labelPosition: 'bottom',
    fontSize: 16, fontColor: '#333333', tintColor: null,
    spans: [[{ text: 'Blocker', bold: false, italic: false }]],
    lineFormats: [{ bold: false, italic: false }],
    attachmentPoints: [
      { rx: 30, ry: 0 }, { rx: 60, ry: 0 }, { rx: 60, ry: 30 }, { rx: 60, ry: 60 },
      { rx: 30, ry: 60 }, { rx: 0, ry: 60 }, { rx: 0, ry: 30 }, { rx: 0, ry: 0 }
    ]
  });

  suite('Obstacle-scored routing', () => {
    // 1. Facing APs with a device dead centre in the corridor: the classic
    //    route ran straight through it. AP 2 (right-centre) -> AP 6
    //    (left-centre), blocker centred between and on the same row.
    let doc = twoBoxDoc(100, 200, 600, 200, 2, 6);
    doc.devices.push(blocker(320, 200));
    t.applyDiagramData(doc);
    let pts = routeOf(t, t.state.connections[0]);
    ok('blocker in the corridor is avoided', crossings(pts, t.state.devices[2], 0) === 0,
      crossings(pts, t.state.devices[2], 0) + ' crossing(s): ' + JSON.stringify(pts));
    ok('the avoiding route is orthogonal', orthoOffenders(pts).length === 0,
      orthoOffenders(pts).join('; '));
    ok('the avoiding route still spans the endpoints',
      pts[0].x === 160 && pts[pts.length - 1].x === 600, JSON.stringify([pts[0], pts[pts.length - 1]]));

    // 2. A clean corridor is untouched: with the blocker far away, the route
    //    must be byte-identical to the two-device route. This is the guarantee
    //    that existing boards (and bends keyed against their natural routes)
    //    cannot change out from under anyone.
    t.applyDiagramData(twoBoxDoc(100, 200, 600, 200, 2, 6));
    const clean = JSON.stringify(routeOf(t, t.state.connections[0]));
    doc = twoBoxDoc(100, 200, 600, 200, 2, 6);
    doc.devices.push(blocker(320, 600));   // same board, blocker out of the way
    t.applyDiagramData(doc);
    ok('a clean corridor keeps the classic route byte-identical',
      JSON.stringify(routeOf(t, t.state.connections[0])) === clean,
      'route changed with no crossing in play');

    // 3. Determinism: scoring has no randomness and ties keep candidate #0.
    doc = twoBoxDoc(100, 200, 600, 200, 2, 6);
    doc.devices.push(blocker(320, 200));
    t.applyDiagramData(doc);
    const r1 = JSON.stringify(routeOf(t, t.state.connections[0]));
    const r2 = JSON.stringify(routeOf(t, t.state.connections[0]));
    ok('avoidance is deterministic', r1 === r2);

    // 4. HAND-SHAPED ROUTES ARE NOT SECOND-GUESSED. Bends apply after routing,
    //    so a router that reshapes the skeleton overrules geometry the user
    //    already drew. The Complex Sample regression: its Access Switch cables
    //    are bent around the printer by hand, the natural line under them DOES
    //    cross it, and avoidance sent both out of their zone on a 713px detour
    //    in place of the drawn 223px one.
    doc = twoBoxDoc(120, 400, 420, 120, 1, 6);
    doc.devices.push(blocker(250, 230));
    t.applyDiagramData(doc);
    const conn = t.state.connections[0];
    if (bendOneSegment(t, conn, 1, 40)) {
      const bent = JSON.stringify(routeOf(t, conn));
      const bad = orthoOffenders(routeOf(t, conn));
      ok('a hand-bent route stays orthogonal', bad.length === 0, bad.join('; '));
      // Move the blocker into the bent route's corridor: the shape must not move.
      t.state.devices[2].x = 200; t.state.devices[2].y = 250;
      ok('a hand-bent route is not re-routed when a device lands in its corridor',
        JSON.stringify(routeOf(t, conn)) === bent, 'the drawn shape changed under the user');
    } else {
      skip('hand-bent route is left alone', 'route too short to bend');
    }

    // 5. Hits count DISTINCT DEVICES, not segment-clips. Counting clips made
    //    the router "improve" a route that clips one device twice by
    //    lengthening it until only one segment clipped - same device crossed,
    //    75px further to do it. Pinned via a geometry where no candidate can
    //    clear the blocker: the route must come back unchanged, not longer.
    doc = twoBoxDoc(200, 100, 200, 600, 4, 0);
    doc.devices.push(blocker(170, 300));      // straddles the only corridor
    doc.devices.push(blocker(280, 300));      // and the obvious way around
    doc.devices[3].id = 'blk2';
    t.applyDiagramData(doc);
    const boxed = t.state.connections[0];
    const before = routeOf(t, boxed);
    const beforeLen = before.reduce((L, p, i) =>
      i ? L + Math.abs(p.x - before[i-1].x) + Math.abs(p.y - before[i-1].y) : 0, 0);
    // A route with nowhere clean to go must not grow chasing a tie.
    const after = routeOf(t, boxed);
    const afterLen = after.reduce((L, p, i) =>
      i ? L + Math.abs(p.x - after[i-1].x) + Math.abs(p.y - after[i-1].y) : 0, 0);
    ok('a route with no clean alternative is not lengthened', afterLen <= beforeLen + 0.5,
      beforeLen + ' -> ' + afterLen);
    ok('the unavoidable case stays orthogonal', orthoOffenders(after).length === 0,
      orthoOffenders(after).join('; '));

    // 6. Vertical corridor variant of case 1 (the other rail branch).
    doc = twoBoxDoc(200, 100, 200, 600, 4, 0);
    doc.devices.push(blocker(200, 320));
    t.applyDiagramData(doc);
    pts = routeOf(t, t.state.connections[0]);
    ok('vertical corridor blocker is avoided', crossings(pts, t.state.devices[2], 0) === 0,
      crossings(pts, t.state.devices[2], 0) + ' crossing(s)');
    ok('vertical avoidance is orthogonal', orthoOffenders(pts).length === 0,
      orthoOffenders(pts).join('; '));

    // 7. Clearance is SOFT - it ranks alternatives the router was already
    //    choosing between and never triggers a reroute on its own. The first
    //    cut padded the obstacle boxes and counted a near-miss as a crossing,
    //    which in a dense zone is nearly every route. Pinned at the extreme:
    //    a route grazing a device by 1px must not move even at max clearance.
    doc = twoBoxDoc(100, 200, 600, 200, 2, 6);
    doc.devices.push(blocker(320, 261));    // 1px below the route's rail
    t.applyDiagramData(doc);
    const grazing = JSON.stringify(routeOf(t, t.state.connections[0]));
    const slider = document.querySelector('iframe').contentDocument.getElementById('route-clearance');
    slider.value = 40;
    slider.dispatchEvent(new (document.querySelector('iframe').contentWindow.Event)('input', { bubbles: true }));
    ok('raising Route Clearance does not re-route a clean board',
      JSON.stringify(routeOf(t, t.state.connections[0])) === grazing,
      'a settled route moved when clearance changed');
    slider.value = 6;
    slider.dispatchEvent(new (document.querySelector('iframe').contentWindow.Event)('input', { bubbles: true }));

    // 8. THE COMPLEX SAMPLE, end to end: the board the user actually looks at.
    //    Every route must be byte-identical to the classic router's output and
    //    no route may cross a device. This is the check that would have caught
    //    the VoIP/POE excursion before it shipped.
    t.resetDocumentState && t.resetDocumentState();
    t.buildComplexSampleDiagram();
    const all = t.state.devices.slice();
    let moved = 0, crossed = [];
    for (const c of t.state.connections) {
      const s = t.resolveConnEndpoint(c, 'from'), e = t.resolveConnEndpoint(c, 'to');
      if (!s || !e) continue;
      const skipIds = new Set([c.fromDevice, c.toDevice]);
      const now = t.connRoutePoints(c, s, e);
      t.state.devices = all.filter(d => skipIds.has(d.id));   // no obstacles -> classic route
      const classic = t.connRoutePoints(c, s, e);
      t.state.devices = all;
      if (JSON.stringify(now) !== JSON.stringify(classic)) moved++;
      for (const d of all) {
        if (skipIds.has(d.id)) continue;
        if (crossings(now, d, 0)) { crossed.push((d.label || d.id) + ' on ' + c.id); break; }
      }
    }
    ok('Complex Sample: every route is byte-identical to the classic router', moved === 0,
      moved + ' of ' + t.state.connections.length + ' routes moved');
    ok('Complex Sample: no route crosses a device', crossed.length === 0, crossed.join('; '));
  });
}

// --- line jumps ------------------------------------------------------------
// A board-level toggle: where two connections cross, the one drawn ON TOP
// (later in state.connections = painted later) hops the one underneath.
// Strictly-interior perpendicular crossings only - a T-junction (a cable
// ENDING on another line, the classic bus tap) is a junction, not a
// crossing, and layered parallel runs never hop. Off by default and omitted
// from saves when off, so existing boards render and round-trip untouched.
function lineJumpSuite(t) {
  const idoc = document.querySelector('iframe').contentDocument;
  const AP = (w,h) => [{rx:w/2,ry:0},{rx:w,ry:0},{rx:w,ry:h/2},{rx:w,ry:h},{rx:w/2,ry:h},{rx:0,ry:h},{rx:0,ry:h/2},{rx:0,ry:0}];
  const box = (id,x,y) => ({ id, x, y, w:60, h:60, label:id, labelPosition:'bottom', fontSize:14,
    fontColor:'#333333', tintColor:null, spans:[[{text:id,bold:false,italic:false}]],
    lineFormats:[{bold:false,italic:false}], attachmentPoints:AP(60,60), fields:{} });
  const conn = (id,a,b,fa,ta) => ({ id, fromDevice:a, fromAP:fa, toDevice:b, toAP:ta, color:'#333333',
    thickness:2, dash:'solid', routing:'rounded', label:'', labelPosition:'top', labelVAlign:'top',
    fontSize:14, fontColor:'#333333', lineFormats:[], spans:[], startArrow:'none', endArrow:'none', annotations:[] });
  const doc = (devs, conns) => ({ version:6, diagramTitle:'jump-test', diagramVersion:1,
    devices:devs, connections:conns, zones:[], textBoxes:[], images:[], groups:[],
    deviceTemplates:[], imageTable:{}, nextId:50 });
  const dOf = id => idoc.getElementById(id).querySelector('.connection-line').getAttribute('d');
  const arcs = id => (dOf(id).match(/A /g)||[]).length;
  const jumpsBtn = () => idoc.getElementById('btn-jumps');

  suite('Line jumps', () => {
    // Fresh documents default jumps ON (2026-08-11 decision) - normal users
    // get them without discovering a button...
    t.resetDocumentState();
    ok('a fresh document defaults jumps ON', jumpsBtn().classList.contains('active'));

    // ...but a LEGACY file saved without the field loads OFF, so
    // deliberately-layered boards keep their drawn look until their author
    // opts in. Crossing pair: horizontal drawn first (under), vertical
    // second (over).
    t.applyDiagramData(doc(
      [box('a',100,300),box('b',500,300),box('c',270,150),box('d',270,450)],
      [conn('cu','a','b',2,6), conn('co','c','d',4,0)]));
    const plainOver = dOf('co'), plainUnder = dOf('cu');
    ok('a fieldless (legacy) board loads jumps OFF: no arcs anywhere',
      arcs('co') === 0 && arcs('cu') === 0);
    ok('save with jumps off omits the field', t.serializeDiagram(false).lineJumps === undefined);

    jumpsBtn().click();
    ok('the TOP connection hops, exactly once', arcs('co') === 1, dOf('co'));
    ok('the UNDERNEATH connection does not hop', arcs('cu') === 0, dOf('cu'));
    ok('toolbar button reflects board state', jumpsBtn().classList.contains('active'));
    ok('save carries lineJumps: true', t.serializeDiagram(false).lineJumps === true);

    // Round trip: a board saved with jumps on renders hops on load.
    const saved = JSON.parse(JSON.stringify(t.serializeDiagram(false)));
    jumpsBtn().click();
    ok('toggle off restores byte-identical paths', dOf('co') === plainOver && dOf('cu') === plainUnder);
    t.applyDiagramData(saved);
    ok('loading a jumps-on board re-renders its hops', arcs('co') === 1 && jumpsBtn().classList.contains('active'));

    // T-junction: cx ENDS on cu's line (bus tap) - a junction, not a crossing.
    t.applyDiagramData(doc(
      [box('a',100,300),box('b',500,300),box('c',270,150)],
      [conn('cu','a','b',2,6), conn('ct','c','a',4,2)]));
    jumpsBtn().click();
    ok('a T-junction tap never hops', arcs('ct') === 0 && arcs('cu') === 0,
      'tap: ' + dOf('ct'));

    // Layered parallel runs (the Complex Sample pattern): same corridor, no
    // perpendicular crossing, no hops - layering draws exactly as layered.
    t.applyDiagramData(doc(
      [box('a',100,300),box('b',500,300)],
      [conn('c1','a','b',2,6), conn('c2','a','b',2,6)]));
    jumpsBtn().click();
    ok('layered parallel connections never hop', arcs('c1') === 0 && arcs('c2') === 0);

    // Fresh board resets the flag - a new diagram must not inherit it.
    t.applyDiagramData(doc([box('a',100,300)],[]));
    ok('a board without the field loads with jumps off', !jumpsBtn().classList.contains('active'));

    // Complex Sample: built fresh, so jumps are ON by default - it renders
    // its (few) genuine crossings as hops, and toggling off restores every
    // path to arc-free.
    t.buildComplexSampleDiagram();
    const arcCount = () => t.state.connections.reduce((n, c) => {
      const el = idoc.getElementById(c.id);
      return n + (el ? (el.querySelector('.connection-line').getAttribute('d').match(/A /g) || []).length : 0);
    }, 0);
    ok('Complex Sample builds with jumps ON and hops its crossings',
      jumpsBtn().classList.contains('active') && arcCount() > 0, arcCount() + ' arcs');
    jumpsBtn().click();
    ok('toggling the sample off renders arc-free', arcCount() === 0, arcCount() + ' arcs');
  });
}

// --- label halo ------------------------------------------------------------
// Every device/zone/image/text-box label strokes a halo behind its glyphs in
// the color of whatever surface it sits on (canvas, zone fill, or the node's
// own face for inside positions). A halo in the exact surface color is
// invisible until a connection runs behind the text - so it is always on,
// with no toggle and NO file-format field. These tests pin the color
// resolution; the render-only nature means round-trip suites already prove
// saves are untouched.
function labelHaloSuite(t) {
  const idoc = document.querySelector('iframe').contentDocument;
  const AP = (w,h) => [{rx:w/2,ry:0},{rx:w,ry:0},{rx:w,ry:h/2},{rx:w,ry:h},{rx:w/2,ry:h},{rx:0,ry:h},{rx:0,ry:h/2},{rx:0,ry:0}];
  const box = (id,x,y,extra) => Object.assign({ id, x, y, w:60, h:60, label:id, labelPosition:'bottom',
    fontSize:14, fontColor:'#333333', tintColor:null, spans:[[{text:id,bold:false,italic:false}]],
    lineFormats:[{bold:false,italic:false}], attachmentPoints:AP(60,60), fields:{} }, extra || {});
  const labelTexts = id => Array.from(idoc.getElementById(id).querySelectorAll('text'))
    .filter(el => !el.classList.contains('ap-label'));
  const halo = id => { const els = labelTexts(id); return els.length ? els[els.length-1].getAttribute('stroke') : null; };
  const rgb = s => { const m = (s||'').match(/\d+/g); return m ? m.map(Number).join(',') : s; };

  t.applyDiagramData({ version:6, diagramTitle:'halo-test', diagramVersion:1,
    devices:[ box('h1', 100, 100),
              box('h2', 400, 130),                              // inside the zone below
              box('h3', 100, 400, { labelPosition:'center' }),
              box('h4', 400, 400, { labelPosition:'center', iconBg:'#223344' }) ],
    connections:[], zones:[ { id:'hz', x:340, y:60, w:220, h:200, fill:'#ffe0e0', opacity:1,
      borderColor:'#aa4444', label:'Halo Zone', labelPosition:'top-inside', shape:'rect' } ],
    textBoxes:[ { id:'ht', x:600, y:100, text:'halo tb', spans:[[{text:'halo tb',bold:false,italic:false}]],
      fontSize:20, fontColor:'#333333' } ],
    images:[], groups:[], deviceTemplates:[], imageTable:{}, nextId:60 });

  suite('Label halo', () => {
    ok('canvas label halos in the canvas color', rgb(halo('h1')) === '255,255,255', halo('h1'));
    ok('a label inside a zone halos in the ZONE fill', rgb(halo('h2')) === '255,224,224', halo('h2'));
    ok('a center label halos in the device FACE', rgb(halo('h3')) === '255,254,254', halo('h3'));
    ok('a custom face color carries into its halo', (halo('h4')||'').toLowerCase() === '#223344', halo('h4'));
    const el = labelTexts('h1')[0];
    ok('halo strokes BEHIND the glyphs (paint-order)', el.getAttribute('paint-order') === 'stroke');
    const tbEl = Array.from(idoc.getElementById('ht').querySelectorAll('text'))[0];
    ok('text boxes halo too', tbEl && tbEl.getAttribute('paint-order') === 'stroke' &&
      rgb(tbEl.getAttribute('stroke')) === '255,255,255', tbEl && tbEl.getAttribute('stroke'));
    // Zone titles are HOISTED into zone-labels-layer, above connections -
    // in the zones layer (bottom) the halo could not help, because a halo
    // only cuts lines painted before it.
    const zl = idoc.getElementById('zl-hz');
    ok('zone title lives in zone-labels-layer', !!zl && zl.parentElement.id === 'zone-labels-layer',
      zl ? zl.parentElement.id : 'zl-hz missing');
    const zEl = zl && Array.from(zl.querySelectorAll('text')).pop();
    ok('zone titles halo in their own fill', zEl && rgb(zEl.getAttribute('stroke')) === '255,224,224',
      zEl && zEl.getAttribute('stroke'));
    const connLayer = idoc.getElementById('connections-layer');
    ok('title layer paints ABOVE connections',
      !!(connLayer.compareDocumentPosition(idoc.getElementById('zone-labels-layer')) & Node.DOCUMENT_POSITION_FOLLOWING));
    ok('the zone group itself no longer carries the title',
      Array.from(idoc.getElementById('hz').querySelectorAll('text')).length === 0);

    // Clicking the hoisted title must still select its zone (the zl- group
    // carries class zone-node + data-zone, resolved through zoneIdOf).
    if (zEl) {
      const iwin = document.querySelector('iframe').contentWindow;
      zEl.dispatchEvent(new iwin.MouseEvent('mousedown', { bubbles: true, cancelable: true, clientX: 0, clientY: 0 }));
      iwin.dispatchEvent(new iwin.MouseEvent('mouseup', { bubbles: true, cancelable: true, clientX: 0, clientY: 0 }));
      ok('clicking the hoisted title selects its zone', t.state.selectedZone === 'hz',
        'selectedZone=' + t.state.selectedZone);
    } else {
      skip('clicking the hoisted title selects its zone', 'no title element');
    }
  });
}

// --- clipboard routing (recency marker) ----------------------------------
// The object clipboard and the OS clipboard have no shared ordering, so paste
// routes by a marker the app stamps into the OS clipboard on internal copy:
// marker present -> objects are newest -> paste objects; image without the
// marker -> the image is newest -> paste it (the bug this pins: one internal
// Ctrl+C used to suppress the paste EVENT forever, so a fresh screenshot
// pasted the morning's stale device); neither -> object-clipboard fallback.
// Everything here goes through the REAL listeners via synthetic events.
async function clipboardSuite(t) {
  const MARKER = 'application/x-crosscanvas-objects';   // pinned: a rename must break this test
  const frame = document.querySelector('iframe');
  const idoc = frame.contentDocument, iwin = frame.contentWindow;
  const counts = () => ({ d: t.state.devices.length, i: t.state.images.length });
  const key = (k) => idoc.body.dispatchEvent(new iwin.KeyboardEvent('keydown',
    { key: k, ctrlKey: true, bubbles: true, cancelable: true }));
  const paste = (dt) => idoc.body.dispatchEvent(new iwin.ClipboardEvent('paste',
    { clipboardData: dt, bubbles: true, cancelable: true }));
  const AP = (w, h) => [{ rx: w/2, ry: 0 }, { rx: w, ry: 0 }, { rx: w, ry: h/2 }, { rx: w, ry: h },
                        { rx: w/2, ry: h }, { rx: 0, ry: h }, { rx: 0, ry: h/2 }, { rx: 0, ry: 0 }];
  const dev = (i) => ({
    id: 'cb' + i, templateId: 'cb' + i + 't', image: '@Server', originalImage: '@Server',
    x: 80 + i * 150, y: 80, w: 60, h: 60, label: 'clip-' + i, labelPosition: 'bottom',
    fontSize: 14, fontColor: '#333333', lineFormats: [{ bold: false, italic: false }],
    spans: [[{ text: 'clip-' + i, bold: false, italic: false }]], tintColor: null,
    attachmentPoints: AP(60, 60), fields: {}
  });
  t.applyDiagramData({ version: 6, appVersion: 'cctest', diagramTitle: 'clip-test', diagramVersion: 1,
    devices: [dev(0), dev(1)], connections: [], zones: [], textBoxes: [], images: [], groups: [],
    deviceTemplates: [], imageTable: {}, nextId: 900 });
  key('a'); key('c');                     // select all -> internal copy (real handlers)
  const r = {};
  r.base = counts();

  let dt = new iwin.DataTransfer();       // 1. marker -> objects win
  dt.setData(MARKER, '1');
  paste(dt);
  r.marker = counts();

  dt = new iwin.DataTransfer();           // 2. image, no marker -> IMAGE wins (the bug)
  const png = Uint8Array.from(atob(
    'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='),
    c => c.charCodeAt(0));
  dt.items.add(new iwin.File([png], 'clip.png', { type: 'image/png' }));
  paste(dt);
  // FileReader + Image decode are async, and the hidden test iframe
  // deprioritizes decode - poll for the image instead of guessing a delay.
  for (let w = 0; w < 40 && counts().i === 0; w++) { await new Promise(res => setTimeout(res, 100)); }
  r.image = counts();

  dt = new iwin.DataTransfer();           // 3. neither -> object fallback
  dt.setData('text/plain', 'external text');
  paste(dt);
  r.text = counts();

  key('v');                               // 4. Ctrl+V, NO paste event at all -> timer fallback
  await new Promise(res => setTimeout(res, 180));
  r.timer = counts();

  suite('Clipboard routing (recency marker)', () => {
    ok('setup: two devices copied internally', r.base.d === 2 && r.base.i === 0, JSON.stringify(r.base));
    ok('marker in OS clipboard -> objects paste', r.marker.d === 4 && r.marker.i === 0, JSON.stringify(r.marker));
    ok('image without marker -> the IMAGE pastes, not the stale copy',
      r.image.i === 1 && r.image.d === 4, JSON.stringify(r.image));
    ok('no image, no marker -> object-clipboard fallback', r.text.d === 6 && r.text.i === 1, JSON.stringify(r.text));
    ok('Ctrl+V with no paste event -> timer fallback still pastes objects',
      r.timer.d === 8 && r.timer.i === 1, JSON.stringify(r.timer));
  });
}

// --- routing invariant ---------------------------------------------------
// An orthogonal (or rounded, which is orthogonal with filleted corners) route
// has NO legitimate diagonal segment, ever. That makes this an absolute
// invariant rather than a matter of taste: no tolerance to argue about, no
// reference shape to compare against, and it holds for every geometry.
//
// It exists because manual bends are stored as { segmentIndex: value } against
// the natural route, and applyManualBends() reads the orientation of segment i
// from the route AS IT IS NOW while `value` was recorded under whatever the
// route was THEN. When a reroute changes the skeleton those disagree, the value
// is written to the wrong axis, and the neighbouring segment stops being
// axis-aligned. See CROSSCANVAS-BACKLOG.md section 1-MECHANISM.
const ORTHO_EPS = 0.75;   // generous: real breakage is tens of pixels

function orthoOffenders(pts) {
  const bad = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const dx = Math.abs(pts[i + 1].x - pts[i].x);
    const dy = Math.abs(pts[i + 1].y - pts[i].y);
    if (dx > ORTHO_EPS && dy > ORTHO_EPS) {
      bad.push('seg' + i + ' (' + Math.round(pts[i].x) + ',' + Math.round(pts[i].y) + ')->(' +
               Math.round(pts[i + 1].x) + ',' + Math.round(pts[i + 1].y) + ') dx=' +
               Math.round(dx) + ' dy=' + Math.round(dy));
    }
  }
  return bad;
}

// The renderer's own pipeline, so the test cannot pass while the shipped path
// disagrees with it.
function routeOf(t, conn) {
  const s = t.resolveConnEndpoint(conn, 'from');
  const e = t.resolveConnEndpoint(conn, 'to');
  if (!s || !e) return null;
  return t.connRoutePoints(conn, s, e);
}

// 8 attachment points on a box: even indices are edge midpoints, ODD indices
// are the corners (1 top-right, 3 bottom-right, 5 bottom-left, 7 top-left).
function twoBoxDoc(ax, ay, bx, by, fromAP, toAP) {
  const box = (id, x, y) => ({
    id, x, y, w: 60, h: 60, label: 'Switch', labelPosition: 'bottom',
    fontSize: 16, fontColor: '#333333', tintColor: null,
    spans: [[{ text: 'Switch', bold: false, italic: false }]],
    lineFormats: [{ bold: false, italic: false }],
    attachmentPoints: [
      { rx: 30, ry: 0 }, { rx: 60, ry: 0 }, { rx: 60, ry: 30 }, { rx: 60, ry: 60 },
      { rx: 30, ry: 60 }, { rx: 0, ry: 60 }, { rx: 0, ry: 30 }, { rx: 0, ry: 0 }
    ]
  });
  return {
    version: 6, diagramTitle: 'routing-invariant', diagramVersion: 1,
    devices: [box('a', ax, ay), box('b', bx, by)],
    connections: [{
      id: 'c1', fromDevice: 'a', fromAP, toDevice: 'b', toAP,
      color: '#333333', thickness: 2, dash: 'solid', routing: 'rounded',
      label: '', labelPosition: 'top', labelVAlign: 'top', fontSize: 16,
      fontColor: '#333333', lineFormats: [], spans: [],
      startArrow: 'none', endArrow: 'none', annotations: []
    }],
    zones: [], textBoxes: [], images: [], groups: [], deviceTemplates: [],
    imageTable: {}, nextId: 90
  };
}

// Shape the connection the way a user does: drag ONE interior segment off its
// natural line. The value is read from the CURRENT route, which is exactly what
// the drag handler stores.
//
// One segment, not all of them. Bending every interior segment hides the defect:
// applyManualBends rewrites both endpoints of each bent segment, so if the
// neighbours are bent too they all move consistently and the polyline stays
// axis-aligned by accident. The damage shows when a bent segment sits next to a
// segment that is still free - which is the normal case, and the only case a
// person actually creates.
function bendOneSegment(t, conn, i, offset) {
  const pts = routeOf(t, conn);
  if (i < 1 || i > pts.length - 3) return false;
  const vert = Math.abs(pts[i].x - pts[i + 1].x) <= Math.abs(pts[i].y - pts[i + 1].y);
  conn.bends = {};
  conn.bends[i] = (vert ? pts[i].x : pts[i].y) + offset;
  return true;
}

function segCount(t, conn) { const p = routeOf(t, conn); return p ? p.length : 0; }

// Distance from a point to the nearest point on a polyline.
function distToPolyline(p, pts) {
  let best = Infinity;
  for (let i = 0; i < pts.length - 1; i++) {
    const ax = pts[i].x, ay = pts[i].y, bx = pts[i + 1].x, by = pts[i + 1].y;
    const dx = bx - ax, dy = by - ay;
    const len2 = dx * dx + dy * dy;
    let u = len2 ? ((p.x - ax) * dx + (p.y - ay) * dy) / len2 : 0;
    u = Math.max(0, Math.min(1, u));
    best = Math.min(best, Math.hypot(p.x - (ax + u * dx), p.y - (ay + u * dy)));
  }
  return best;
}

// Discrete Hausdorff distance between two polylines - and it must be BOTH
// directions. New-vertices-to-old-path alone rewards forgetting: a natural
// route that abandons the user's detour entirely can sit closer to the old
// path than the fitted one does, because the old DETOUR is what is far from
// everything. The old-to-new direction is what charges for dropping it.
function routeDistance(a, b) {
  let worst = 0;
  for (const p of a) worst = Math.max(worst, distToPolyline(p, b));
  for (const p of b) worst = Math.max(worst, distToPolyline(p, a));
  return worst;
}

function routingSuite(t) {
  suite('Routing invariant (orthogonal routes stay orthogonal)', () => {
    // Baseline: a freshly routed connection, no manual bends. If this ever
    // fails the router itself is broken, not the bend machinery.
    [[1, 6], [0, 6], [4, 0], [2, 6], [3, 7], [1, 5]].forEach(([fa, ta]) => {
      t.applyDiagramData(twoBoxDoc(120, 400, 420, 120, fa, ta));
      const bad = orthoOffenders(routeOf(t, t.state.connections[0]));
      ok('natural route is orthogonal (AP ' + fa + ' -> ' + ta + ')', bad.length === 0, bad.join('; '));
    });

    // 1. Change an attachment point on a connection carrying a manual bend.
    //    Geometry matters: these are STACKED devices, where the natural route
    //    has enough segments that an AP change can flip one's orientation. A
    //    diagonal arrangement mostly cannot, which is how the first version of
    //    this test passed while the bug was plainly reproducible by hand.
    [
      { a: [120, 400], b: [120, 120], fa: 0, ta: 0, seg: 1, to: 4 },
      { a: [120, 400], b: [120, 120], fa: 0, ta: 3, seg: 1, to: 1 },
      { a: [120, 400], b: [120, 120], fa: 0, ta: 5, seg: 1, to: 7 },
      { a: [120, 400], b: [120, 120], fa: 0, ta: 0, seg: 3, to: 4 }
    ].forEach(c => {
      t.applyDiagramData(twoBoxDoc(c.a[0], c.a[1], c.b[0], c.b[1], c.fa, c.ta));
      const conn = t.state.connections[0];
      if (!bendOneSegment(t, conn, c.seg, 40)) { skip('AP ' + c.fa + '->' + c.to + ' seg ' + c.seg, 'route too short'); return; }
      conn.fromAP = c.to;
      const bad = orthoOffenders(routeOf(t, conn));
      ok('AP ' + c.fa + '->' + c.to + ', bend on seg ' + c.seg + ', stays orthogonal',
        bad.length === 0, bad.join('; '));
    });

    // 2. Move ONE endpoint device. Bends are absolute and do not travel, so the
    //    skeleton around them changes underneath the stored index.
    [
      { b: [130, 110], fa: 0, ta: 3, seg: 1, mv: [-40, 0] },
      { b: [130, 110], fa: 0, ta: 3, seg: 3, mv: [-40, 0] },
      { b: [180, 150], fa: 0, ta: 3, seg: 1, mv: [-90, 60] }
    ].forEach(c => {
      t.applyDiagramData(twoBoxDoc(120, 400, c.b[0], c.b[1], c.fa, c.ta));
      const conn = t.state.connections[0];
      if (!bendOneSegment(t, conn, c.seg, 40)) { skip('move ' + c.mv, 'route too short'); return; }
      const b = t.state.devices.find(d => d.id === 'b');
      b.x += c.mv[0]; b.y += c.mv[1];
      const bad = orthoOffenders(routeOf(t, conn));
      ok('move far device by (' + c.mv + '), bend on seg ' + c.seg + ', stays orthogonal',
        bad.length === 0, bad.join('; '));
    });

    // 3. A bounded sweep, so this suite cannot quietly go vacuous the way the
    //    hand-picked fixtures above did. Every AP pair, several geometries,
    //    every interior segment bent in turn, every other AP tried as the new
    //    one. Reports the count rather than one case, because the count is what
    //    tells you whether a fix actually closed the class.
    let swept = 0, broke = 0, example = '';
    for (const fa of [0, 1, 2, 3, 4, 5, 6, 7]) {
      for (const ta of [0, 3, 5, 6]) {
        for (const geo of [[120, 120], [130, 110], [420, 120]]) {
          t.applyDiagramData(twoBoxDoc(120, 400, geo[0], geo[1], fa, ta));
          const conn = t.state.connections[0];
          const n = segCount(t, conn);
          for (let seg = 1; seg <= n - 3; seg++) {
            for (const to of [0, 1, 2, 3, 4, 5, 6, 7]) {
              if (to === fa) continue;
              if (!bendOneSegment(t, conn, seg, 40)) continue;
              const saved = conn.fromAP;
              conn.fromAP = to;
              swept++;
              const bad = orthoOffenders(routeOf(t, conn));
              if (bad.length) {
                broke++;
                if (!example) example = 'AP ' + fa + '->' + to + ' to ' + ta + ' at ' + geo + ' seg ' + seg + ': ' + bad[0];
              }
              conn.fromAP = saved;
            }
          }
        }
      }
    }
    ok('sweep: no AP change leaves a diagonal (' + swept + ' combinations)', broke === 0,
      broke ? broke + ' of ' + swept + ' produced a diagonal; e.g. ' + example : swept + ' clean');

    // 4. The two properties orthogonality alone cannot pin. Deleting every bend
    //    would pass the checks above; these are what make that a non-fix.
    //
    // 4a. A bend still APPLIES when the skeleton accommodates it - moving to an
    //     adjacent AP with the same route shape must keep the user's shape, not
    //     fall back to natural. Diagonal arrangement: AP 0 -> 6 routes VHV-ish
    //     and AP 1 (top-right corner) keeps that skeleton.
    t.applyDiagramData(twoBoxDoc(120, 400, 420, 120, 0, 6));
    {
      const conn = t.state.connections[0];
      const p0 = routeOf(t, conn);
      const o0 = [];
      for (let i = 0; i < p0.length - 1; i++) o0.push(Math.abs(p0[i].x - p0[i + 1].x) <= Math.abs(p0[i].y - p0[i + 1].y));
      bendOneSegment(t, conn, 1, 40);
      const bent = routeOf(t, conn);
      const bentVal = o0[1] ? bent[1].x : bent[1].y;
      conn.fromAP = 1;
      const p1 = routeOf(t, conn);
      const same = p1.length === p0.length;
      const still = same ? (o0[1] ? p1[1].x : p1[1].y) : null;
      ok('same-skeleton AP change keeps the bend applied',
        same && Math.abs(still - bentVal) < 0.75,
        same ? 'bent value ' + bentVal + ', after AP change ' + still : 'skeleton changed (' + p0.length + ' -> ' + p1.length + ' pts), fixture needs new APs');
    }

    // 4b. A skipped bend is skipped, NOT deleted: restore the old geometry and
    //     the bent shape comes back exactly. Uses a known skeleton-changing AP
    //     move from the failing set above.
    t.applyDiagramData(twoBoxDoc(120, 400, 120, 120, 0, 0));
    {
      const conn = t.state.connections[0];
      bendOneSegment(t, conn, 1, 40);
      const before = JSON.stringify(routeOf(t, conn));
      const storedBefore = JSON.stringify(conn.bends);
      conn.fromAP = 4;                          // skeleton changes; bend must skip
      const away = orthoOffenders(routeOf(t, conn));
      conn.fromAP = 0;                          // and coming back restores it
      const after = JSON.stringify(routeOf(t, conn));
      ok('skipped bend stays orthogonal while away', away.length === 0, away.join('; '));
      ok('bend storage survives the round trip', JSON.stringify(conn.bends) === storedBefore,
        'stored ' + storedBefore + ' now ' + JSON.stringify(conn.bends));
      ok('restoring the AP restores the bent shape exactly', after === before,
        after === before ? '' : 'before ' + before.slice(0, 80) + '... after ' + after.slice(0, 80) + '...');
    }

    // 5. The re-fit: after an AP change, refitBendsToPath keeps the route near
    //    the shape the user made instead of snapping to natural. Distances are
    //    routeDistance (symmetric Hausdorff) - see its comment for why one
    //    direction alone would let "forget the detour" win.
    //
    // 5a. The one-notch nudge: same face, adjacent AP, big manual detour. The
    //     UI used to DELETE the bends here; the re-fit must keep the shape to
    //     within roughly the AP step, while delete-then-natural is off by the
    //     full detour.
    t.applyDiagramData(twoBoxDoc(120, 400, 420, 80, 0, 6));
    {
      const conn = t.state.connections[0];
      bendOneSegment(t, conn, 1, 200);
      const before = routeOf(t, conn).map(p => ({ x: p.x, y: p.y }));
      conn.fromAP = 1;
      delete conn.bends;                        // what the old endpoint-drop did
      const dNat = routeDistance(routeOf(t, conn), before);
      t.refitBendsToPath(conn, before);
      const fitted = routeOf(t, conn);
      const dFit = routeDistance(fitted, before);
      const bad = orthoOffenders(fitted);
      ok('one-notch AP nudge: re-fit keeps the detour (dist ' + Math.round(dFit) + 'px)', dFit <= 60, 'dist ' + dFit);
      ok('one-notch AP nudge: delete-then-natural loses it (dist ' + Math.round(dNat) + 'px)', dNat >= 150, 'dist ' + dNat);
      ok('one-notch AP nudge: fitted route is orthogonal', bad.length === 0, bad.join('; '));
      ok('one-notch AP nudge: bends were recreated', !!conn.bends && Object.keys(conn.bends).length > 0);
    }

    // 5b. A skeleton-CHANGING move (the stacked pair from the failing set).
    //     The new skeleton has no segment to hang every old rail on, so the
    //     promise is weaker - corridor preserved, not shape copied - but it
    //     must still beat delete-then-natural by a wide margin.
    t.applyDiagramData(twoBoxDoc(120, 400, 120, 120, 0, 0));
    {
      const conn = t.state.connections[0];
      bendOneSegment(t, conn, 2, 200);
      const before = routeOf(t, conn).map(p => ({ x: p.x, y: p.y }));
      conn.fromAP = 4;
      delete conn.bends;
      const dNat = routeDistance(routeOf(t, conn), before);
      t.refitBendsToPath(conn, before);
      const fitted = routeOf(t, conn);
      const dFit = routeDistance(fitted, before);
      const bad = orthoOffenders(fitted);
      ok('skeleton change: corridor preserved (dist ' + Math.round(dFit) + 'px vs natural ' + Math.round(dNat) + 'px)',
        dFit <= 140 && dNat >= 200 && dFit < dNat - 50, 'fit ' + dFit + ' nat ' + dNat);
      ok('skeleton change: fitted route is orthogonal', bad.length === 0, bad.join('; '));
    }

    // 5c. The ratchet, end to end through the real function: raising the AP
    //     count re-snaps every endpoint on the node, and setNodeAPCount now
    //     re-fits each attached bend-carrying connection itself.
    t.applyDiagramData(twoBoxDoc(120, 400, 120, 120, 0, 0));
    {
      const conn = t.state.connections[0];
      bendOneSegment(t, conn, 2, 200);
      const before = routeOf(t, conn).map(p => ({ x: p.x, y: p.y }));
      const a = t.state.devices.find(d => d.id === 'a');
      t.setNodeAPCount(a, 12);
      const fitted = routeOf(t, conn);
      const dFit = routeDistance(fitted, before);
      const bad = orthoOffenders(fitted);
      ok('AP-count ratchet 8 -> 12 keeps the shape (dist ' + Math.round(dFit) + 'px)', dFit <= 60, 'dist ' + dFit);
      ok('AP-count ratchet: route is orthogonal', bad.length === 0, bad.join('; '));
      ok('AP-count ratchet: bends survived', !!conn.bends && Object.keys(conn.bends).length > 0);
    }
  });
}

// Connect mode routes a body press to either a connection or a grab. The
// gesture itself cannot be tested here - this harness cannot emit mousemove
// sequences - which is exactly why the DECISION was extracted into a pure
// function. These pin the routing table; only feel is left for a human.
function connectIntentSuite(t) {
  suite('Connect-mode press routing (connectIntentAt)', () => {
    // 60x60 box, 8 APs: edge midpoints at even indices, corners at odd.
    // Centre is 30px from each edge AP and ~42px from each corner.
    const box = { x: 100, y: 100, w: 60, h: 60, attachmentPoints: [
      { rx: 30, ry: 0 }, { rx: 60, ry: 0 }, { rx: 60, ry: 30 }, { rx: 60, ry: 60 },
      { rx: 30, ry: 60 }, { rx: 0, ry: 60 }, { rx: 0, ry: 30 }, { rx: 0, ry: 0 } ] };
    const at = (x, y, z) => t.connectIntentAt(box, x, y, z === undefined ? 1 : z);

    // The complaint this feature exists to fix.
    ok('dead centre is a GRAB, not a connection', at(130, 130).action === 'move',
      JSON.stringify(at(130, 130)));

    // Directly on an AP still draws, and from the RIGHT one.
    const onTop = at(130, 100);
    ok('pressing an AP connects from that AP', onTop.action === 'connect' && onTop.ap === 0,
      JSON.stringify(onTop));
    const onCorner = at(160, 160);
    ok('corner AP resolves to the corner index', onCorner.action === 'connect' && onCorner.ap === 3,
      JSON.stringify(onCorner));

    // Slop here is the CAP, not the screen constant: min(18, 0.25 * 60) = 15.
    ok('12px from an AP still connects (inside slop)', at(130, 112).action === 'connect');
    ok('25px from an AP grabs (outside slop)', at(130, 125).action === 'move');

    // The property the 0.25 cap exists to give: the grab zone is the middle
    // HALF of the node. On a 60px box that is y in (115, 145) along the centre
    // line - so 14px in from an edge AP draws, and 16px in grabs.
    ok('cap boundary: 14px from the edge AP draws', at(130, 114).action === 'connect');
    ok('cap boundary: 16px from the edge AP grabs', at(130, 116).action === 'move');

    // THE ZOOM PAIR. Slop is screen pixels, so in diagram units it must GROW as
    // zoom shrinks. Get the division backwards and exactly this flips.
    //
    // It needs a node big enough that the size cap does not bind, which the
    // 60px box is NOT - there, min(18/0.5, 0.3*60) = min(36, 18) = 18, so the
    // cap pins slop and zoom changes nothing. Written against a 200px node
    // where the zoom term is live: 18 at zoom 1, 36 at zoom 0.5.
    const big = { x: 0, y: 0, w: 200, h: 200, attachmentPoints: [
      { rx: 100, ry: 0 }, { rx: 200, ry: 0 }, { rx: 200, ry: 100 }, { rx: 200, ry: 200 },
      { rx: 100, ry: 200 }, { rx: 0, ry: 200 }, { rx: 0, ry: 100 }, { rx: 0, ry: 0 } ] };
    ok('25px from an AP grabs at zoom 1.0 (slop 18)',
      t.connectIntentAt(big, 100, 25, 1.0).action === 'move');
    ok('...and connects at zoom 0.5, because slop doubles in diagram units',
      t.connectIntentAt(big, 100, 25, 0.5).action === 'connect');

    // And the interaction that broke the first version of this test, pinned so
    // it is a documented rule rather than a surprise: on a node small enough
    // that the cap binds, zoom stops mattering. Correct - at 50% a 60px device
    // is 30 screen px across, and a screen-constant slop would leave no grab
    // zone at all. Below the cap the split becomes proportional instead.
    ok('on a small node the CAP wins and zoom stops mattering',
      at(130, 122, 1.0).action === at(130, 122, 0.5).action);

    // The cap: without it a big slop swallows a small node whole, which is the
    // original bug on the objects where it was worst.
    const tiny = { x: 0, y: 0, w: 20, h: 20, attachmentPoints: [
      { rx: 10, ry: 0 }, { rx: 20, ry: 10 }, { rx: 10, ry: 20 }, { rx: 0, ry: 10 } ] };
    ok('a 20px node keeps a grabbable centre (cap applies)',
      t.connectIntentAt(tiny, 10, 10, 1).action === 'move',
      JSON.stringify(t.connectIntentAt(tiny, 10, 10, 1)));

    // Large zones: long edge runs far from any AP now move instead of drawing
    // from a distant corner.
    const zone = { x: 0, y: 0, w: 400, h: 300, attachmentPoints: [
      { rx: 200, ry: 0 }, { rx: 400, ry: 0 }, { rx: 400, ry: 150 }, { rx: 400, ry: 300 },
      { rx: 200, ry: 300 }, { rx: 0, ry: 300 }, { rx: 0, ry: 150 }, { rx: 0, ry: 0 } ] };
    ok('a zone edge far from any AP is a grab',
      t.connectIntentAt(zone, 100, 0, 1).action === 'move');
    ok('a zone edge AP still connects',
      t.connectIntentAt(zone, 200, 0, 1).action === 'connect');

    // Degenerate input must not throw or connect from nowhere.
    ok('a node with no APs is always a grab',
      t.connectIntentAt({ x: 0, y: 0, w: 50, h: 50, attachmentPoints: [] }, 25, 25, 1).action === 'move');
    ok('zoom 0 does not divide by zero',
      ['move', 'connect'].includes(at(130, 130, 0).action));

    // The old behaviour, kept for connections that legitimately need it (the
    // DROP end still snaps by nearest AP with no threshold at all).
    ok('nearestAPIndex is unchanged and still thresholdless',
      t.nearestAPIndex(box, 130, 129) === 0 && t.nearestAPIndex(box, 130, 131) === 4);
  });
}

// conn.labelT slides a connection's label along its own route. The claims worth
// pinning are the ones a future refactor could quietly break: absent means
// centre (so old boards are untouched), a stored value is HONOURED by the same
// anchor every consumer calls, and the value survives a save/load round trip.
function labelSlideSuite(t) {
  suite('Sliding connection labels (conn.labelT)', () => {
    t.applyDiagramData(twoBoxDoc(120, 400, 420, 120, 0, 6));
    const conn = t.state.connections[0];
    conn.label = 'Gi1/0/1';
    conn.spans = [[{ text: 'Gi1/0/1', bold: false, italic: false }]];
    const pts = routeOf(t, conn);

    // Absent = centre. The whole back-compat promise is this one line: every
    // board written before the feature has no labelT, and must anchor exactly
    // where it always did.
    const mid = t.getPointAlongPath(pts, 0.5);
    const anchorDefault = t.connLabelAnchor(pts, conn);
    ok('no labelT anchors at the midpoint',
      Math.abs(anchorDefault.x - mid.x) < 0.01 && Math.abs(anchorDefault.y - mid.y) < 0.01,
      JSON.stringify(anchorDefault) + ' vs ' + JSON.stringify(mid));

    // A stored value moves it, and moves it the RIGHT way: t=0.15 must land
    // nearer the from end than the midpoint does. Comparing against the ends
    // rather than a hard-coded pixel keeps the test honest if the router
    // changes.
    const from = pts[0], to = pts[pts.length - 1];
    conn.labelT = 0.15;
    const near = t.connLabelAnchor(routeOf(t, conn), conn);
    conn.labelT = 0.85;
    const far = t.connLabelAnchor(routeOf(t, conn), conn);
    ok('labelT 0.15 sits nearer the from end',
      Math.hypot(near.x - from.x, near.y - from.y) < Math.hypot(mid.x - from.x, mid.y - from.y));
    ok('labelT 0.85 sits nearer the to end',
      Math.hypot(far.x - to.x, far.y - to.y) < Math.hypot(mid.x - to.x, mid.y - to.y));
    ok('the two ends are not the same point',
      Math.hypot(near.x - far.x, near.y - far.y) > 20);

    // Out-of-range values clamp instead of running off the end of the polyline
    // (a label centred exactly on an endpoint sits on the device).
    conn.labelT = 5;
    const over = t.connLabelAnchor(routeOf(t, conn), conn);
    conn.labelT = -3;
    const under = t.connLabelAnchor(routeOf(t, conn), conn);
    ok('labelT clamps at both ends', t.connLabelT({ labelT: 5 }) <= 0.98 && t.connLabelT({ labelT: -3 }) >= 0.02,
      t.connLabelT({ labelT: 5 }) + ' / ' + t.connLabelT({ labelT: -3 }));
    ok('a clamped anchor is still on the route',
      distToPolyline(over, pts) < 1 && distToPolyline(under, pts) < 1);
    ok('a garbage labelT falls back to centre', t.connLabelT({ labelT: 'x' }) === 0.5);

    // The drag stores what getNearestT projects, so a point taken FROM the
    // route must round-trip back to roughly the t it came from. This is the
    // link between the pointer maths and the stored field.
    const probe = t.getPointAlongPath(pts, 0.3);
    ok('getNearestT recovers the t a point came from',
      Math.abs(t.getNearestT(pts, probe.x, probe.y).t - 0.3) < 0.02,
      String(t.getNearestT(pts, probe.x, probe.y).t));

    // Round trip. Serialize writes connections wholesale, but that is an
    // implementation detail today - pin it so an added field whitelist cannot
    // silently drop the value.
    conn.labelT = 0.22;
    const reloaded = JSON.parse(JSON.stringify(t.serializeDiagram()));
    t.applyDiagramData(reloaded);
    ok('labelT survives serialize -> load', t.state.connections[0].labelT === 0.22,
      String(t.state.connections[0].labelT));

    // And absent stays absent, rather than being written out as an explicit
    // 0.5 that would make every re-saved old board differ.
    delete t.state.connections[0].labelT;
    const plain = JSON.parse(JSON.stringify(t.serializeDiagram()));
    ok('a centred label writes no labelT field', !('labelT' in plain.connections[0]),
      JSON.stringify(plain.connections[0].labelT));
  });
}

// Optional: round-trip real corpus files if they are present beside the app
// (GliffyExamples/ and Examples/ are git-ignored, so this skips in a clone).
// Paths are relative to this file, which lives one level down in tools/.
async function corpusSuite(t) {
  suite('Corpus round-trip (local files, skipped if absent)', () => {});
  const gliffy = ['../GliffyExamples/ally_lab.gliffy', '../GliffyExamples/homes5860.gliffy'];
  const xcanvas = ['../Examples/acme-global-network_v1.xcanvas'];
  for (const path of gliffy) {
    try {
      const res = await fetch(path);
      if (!res.ok) { skip(path, 'not present (' + res.status + ')'); continue; }
      const data = JSON.parse(await res.text());
      t.resetDocumentState();
      t.importGliffy(data, path, true);
      const fp = fixedPoint(t);
      ok(path + ' imports + round-trips', fp.diff === null && (fp.s2.devices || []).length > 0,
        fp.diff || ((fp.s2.devices || []).length + ' devices'));
    } catch (e) { ok(path, false, String(e && e.message || e)); }
  }
  for (const path of xcanvas) {
    try {
      const res = await fetch(path);
      if (!res.ok) { skip(path, 'not present (' + res.status + ')'); continue; }
      const data = JSON.parse(await res.text());
      t.applyDiagramData(data);
      const fp = fixedPoint(t);
      ok(path + ' round-trips', fp.diff === null, fp.diff || '');
    } catch (e) { ok(path, false, String(e && e.message || e)); }
  }
}

// --- boot: wait for the app iframe, grab its test hook -------------------
const frame = document.getElementById('app');
frame.addEventListener('load', () => {
  setTimeout(async () => {
    try {
      const w = frame.contentWindow;
      w.alert = () => {}; w.confirm = () => true;   // never let the app block the run
      const t = w.__cctest;
      if (!t) { document.getElementById('summary').textContent = 'FAIL - test hook missing (app.js did not expose __cctest for ?cctest)'; document.getElementById('summary').className = 'fail'; return; }
      await run(t);
    } catch (e) {
      const sum = document.getElementById('summary');
      sum.className = 'fail';
      sum.textContent = 'FAIL - runner threw: ' + (e && e.message || e);
      console.error(e);
    }
  }, 400);
});
